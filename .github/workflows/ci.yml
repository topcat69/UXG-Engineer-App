name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint

      # RLS tests hit a real local Postgres + GoTrue instance, per the
      # project's "no mocks or stubs" rule — there's no fake to substitute.
      - run: pnpm exec supabase start
      - name: Export local Supabase URL/keys for tests
        run: |
          eval "$(pnpm exec supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # Must match seed.sql's app_settings 'webhook_secret' row — the
            # DB webhook triggers (status-submitted, issue-blocks-completion)
            # send this value as X-Webhook-Secret, and the receiving routes
            # 401 without a match. Locally this comes from .env.local, which
            # is gitignored and never exists in CI, so it has to be set here
            # too. It's a local/test-only value, already checked into
            # seed.sql, not a real secret.
            echo "WEBHOOK_SHARED_SECRET=local-dev-webhook-secret-not-for-production-use"
          } >> "$GITHUB_ENV"

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - run: pnpm build

      - if: always()
        run: pnpm exec supabase stop
