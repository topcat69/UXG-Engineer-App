name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # RLS tests hit a real local Postgres + GoTrue instance, per the
      # project's "no mocks or stubs" rule — there's no fake to substitute.
      - run: pnpm exec supabase start
      - name: Export local Supabase URL/keys for tests
        run: |
          eval "$(pnpm exec supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      - run: pnpm build

      - if: always()
        run: pnpm exec supabase stop
